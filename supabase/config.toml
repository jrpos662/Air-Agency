# Supabase CLI configuration (minimal).
# Hosted project settings (Auth, API, etc.) are managed in the Supabase Dashboard.
# GitHub Actions only runs `supabase db push` and `supabase functions deploy`.

project_id = "air-ticket-agency-management"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db.migrations]
enabled = true
